x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the nanobot user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  nanobot:
    container_name: nanobot
    <<: *common-config
    command: ["gateway"]
    restart: always
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    volumes:
      - ~/.nanobot:/home/nanobot/.nanobot
      - /mnt/HC_Volume_104301936/obsidian:/mnt/obsidian
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  briefings:
    container_name: briefings
    <<: *common-config
    command: ["gateway"]
    restart: always
    ports:
      - 127.0.0.1:18791:18790
      - 8766:8765
    volumes:
      - ./instances/briefings/.nanobot:/home/nanobot/.nanobot
      - /mnt/HC_Volume_104301936/obsidian:/mnt/obsidian
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    volumes:
      - ~/.nanobot:/home/nanobot/.nanobot
      - /mnt/HC_Volume_104301936/obsidian:/mnt/obsidian
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
    volumes:
      - ~/.nanobot:/home/nanobot/.nanobot
      - /mnt/HC_Volume_104301936/obsidian:/mnt/obsidian
